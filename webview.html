<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>AI Commit Message Generator</title>
        <link rel="stylesheet" href="{{STYLE_URI}}" />
    </head>
    <body>
        <div class="card">
            <h1>🤖 AI Commit Message Generator</h1>
            <form id="commitForm">
                <div>
                    <label for="type">Commit Type</label>
                    <select id="type" name="type">
                        <option value="feat">feat - New feature</option>
                        <option value="fix">fix - Bug fix</option>
                        <option value="chore">chore - Maintenance</option>
                        <option value="refactor">refactor - Code refactor</option>
                        <option value="docs">docs - Documentation</option>
                        <option value="test">test - Testing</option>
                        <option value="style">style - Formatting</option>
                    </select>
                </div>

                <div>
                    <label for="ticket">Ticket ID</label>
                    <input type="text" id="ticket" name="ticket" placeholder="e.g., JIRA-1012" />
                    <div id="ticketError">Please enter Ticket ID</div>
                </div>
				
				<div id="commitSection">
					<div class="buttons">
						<button type="button" id="generateCommitBtn">✨ Analyze & Suggest Commit</button>
					</div>

					<div>
						<label for="commitTitle">Generated Commit Message</label>
						<textarea id="commitTitle" placeholder="Your commit message will appear here..."></textarea>
					</div>
					
					<div class="buttons">
						<button type="button" id="commitBtn">✅ Commit and Push</button>
					</div>
				</div>
				
				<div id="prSection">
					<div class="buttons">
						<button type="button" id="generatePRBtn">✨ Suggest Description</button>
					</div>

					<div>
						<label for="prDescription">Generated PR Description</label>
						<textarea id="prDescription" placeholder="Your PR description will appear here..."></textarea>
					</div>
					
					<div class="buttons">
						<select id="baseBranch" name="baseBranch" style="width: auto;">
							<option value="fff">ffff</option>
						</select>
						<button type="button" id="createPRBtn">✅ Create PR</button>
					</div>
				</div>
				
                <div id="errorMessage"></div>

                <div id="loader" style="display: none;">
                    <div class="spinner"></div>
                    <span class="loader-text">Generating commit message, please wait...</span>
                </div>

				<div id="timer" style="display: none;">
                    <div>⏱️ </div>
                    <span id="timer-text"></span>
                </div>
            </form>

            <div class="powered-by">
                ⚡ Powered by ChittTaranga Team
            </div>
        </div>
        <script src="{{SCRIPT_URI}}"></script>
    </body>
</html>
